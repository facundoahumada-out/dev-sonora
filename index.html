<!DOCTYPE html>
<html lang="es" class="motion-safe:scroll-smooth"> <!-- Animación simple para el scroll-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="shortcut icon" href="public/icon.png" type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="min-h-screen overflow-x-clip pb-24">
    <nav class="sticky top-0 z-50 flex items-center gap-4 border-b border-gray-200 bg-white px-2 py-2 text-base">

        <div class="flex flex-1 min-w-0 items-center gap-4">
            <button type="button" aria-label="Abrir menú" class="material-symbols-outlined text-2xl text-gray-500">menu</button>
            <a href="#" class="flex shrink-0 items-center gap-2 px-1">
                <span class="material-symbols-outlined bg-gradient-to-r from-slate-300 via-slate-500 to-slate-800 bg-clip-text text-2xl text-transparent">airwave</span>
                <span class="font-bold">Sonora</span>
            </a>
        </div>

        <div class="hidden w-full max-w-[400px] flex-1 min-[800px]:flex">
            <div class="flex w-full items-center gap-2 rounded-md border border-gray-300 bg-gray-50 transition-colors focus-within:border-blue-500">
                <span class="material-symbols-outlined shrink-0 px-2 text-2xl text-gray-500 select-none">search</span>
                <input type="text" aria-label="Buscar" placeholder="Buscar pistas, artistas o álbumes" class="min-w-0 flex-1 bg-transparent py-1 text-base focus:outline-none">
                <span class="material-symbols-outlined shrink-0 px-2 text-2xl text-gray-500 select-none">filter_alt</span>
            </div>
        </div>

        <div class="flex flex-1 items-center justify-end gap-4 select-none">
            <button type="button" aria-label="Notificaciones" class="relative grid h-9 w-9 place-items-center rounded-md text-gray-500">
                <span class="material-symbols-outlined text-2xl">inbox</span>
                <span class="absolute right-1.5 top-1.5 h-3 w-3 rounded-full border-2 border-white bg-blue-600"></span>
            </button>
            <button type="button" aria-label="Cuenta" class="flex items-center gap-1 rounded-md pr-2">
                <!-- Incluir en un futuro despliegue en usuario -->
                <span class="grid h-7 w-7 select-none place-items-center rounded-full border-2 border-gray-300 bg-gradient-to-b from-slate-300 to-slate-500 text-xs font-medium text-white">RS</span>
                <span class="material-symbols-outlined text-base text-gray-500">expand_more</span>
            </button>
        </div>
    </nav>
</body>
</html>
